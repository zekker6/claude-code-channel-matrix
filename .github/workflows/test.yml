name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: task install

      - name: Run tests
        run: task test
